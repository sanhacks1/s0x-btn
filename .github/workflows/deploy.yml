name: deploy
on: deployment
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.deployment.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: deploy
        env:
          PROD_SECRET: ${{ secrets.S0X_PROD_CANARY }}
        run: bash ./deploy.sh
